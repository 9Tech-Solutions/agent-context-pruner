[project]
name = "pruner-systemone-server"
version = "0.1.0"
description = "A /v1/systemone server for agent-context-pruner around any model with a system_one() method, such as LiquidAI/d1-3B."
readme = "README.md"
license = "MIT"
authors = [{ name = "9Tech Solutions", email = "info@9tech.solutions" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Loading a Hugging Face model; the server itself needs only the standard library.
hf = ["torch", "transformers"]

[project.scripts]
pruner-systemone-server = "pruner_systemone_server.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[tool.ruff]
line-length = 110
